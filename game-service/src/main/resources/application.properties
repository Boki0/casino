spring.application.name=game-service
server.port=8087

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/casino_platform}
spring.datasource.username=${DB_USERNAME:casino_user}
spring.datasource.password=${DB_PASSWORD:casino_password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
