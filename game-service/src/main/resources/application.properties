spring.application.name=game-service
server.port=8087
internal.gateway.secret=${INTERNAL_GATEWAY_SECRET:local-gateway-secret-change-me}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/casino_platform}
spring.datasource.username=${DB_USERNAME:casino_user}
spring.datasource.password=${DB_PASSWORD:casino_password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

game.provider.base-url=${GAME_PROVIDER_BASE_URL:https://site--mock-game-provider--glnqkccxvg7l.code.run}
game.provider.providers-path=${GAME_PROVIDER_PROVIDERS_PATH:/api/providers}
game.provider.games-path=${GAME_PROVIDER_GAMES_PATH:/api/games}
game.provider.launch-path=${GAME_PROVIDER_LAUNCH_PATH:/api/launch}
game.provider.allow-empty-game-snapshot=${GAME_PROVIDER_ALLOW_EMPTY_GAME_SNAPSHOT:false}
game.session.ttl=${GAME_SESSION_TTL:15m}
game.wallet.base-url=${GAME_WALLET_BASE_URL:http://localhost:8083}
game.wallet.balance-path=${GAME_WALLET_BALANCE_PATH:/internal/wallets/balance}
game.wallet.debit-path=${GAME_WALLET_DEBIT_PATH:/internal/wallets/debit}
game.wallet.credit-path=${GAME_WALLET_CREDIT_PATH:/internal/wallets/credit}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
