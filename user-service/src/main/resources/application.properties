spring.application.name=user-service

server.port=8082

spring.datasource.url=jdbc:postgresql://localhost:5433/casino_platform
spring.datasource.username=casino_user
spring.datasource.password=casino_password

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=casino_rabbit
spring.rabbitmq.password=casino_rabbit_password

internal.gateway.secret=local-gateway-secret-change-me

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

management.endpoints.web.exposure.include=health,info
