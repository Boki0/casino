spring.application.name=payment-service
server.port=8085

spring.datasource.url=jdbc:postgresql://localhost:5433/casino_platform
spring.datasource.username=casino_user
spring.datasource.password=casino_password
spring.datasource.driver-class-name=org.postgresql.Driver

internal.gateway.secret=local-gateway-secret-change-me

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
