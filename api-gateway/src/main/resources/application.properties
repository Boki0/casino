spring.application.name=api-gateway
server.port=8080

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

jwt.secret=NSedStA/GLFKtUz3SOIuyrchg6bzht1Uk+fNQ5unfNv2bYGwGbPPg7s7hWw2P98i47GJmegCxNCthEPFRQlhSA==
jwt.expiration-seconds=900

internal.gateway.secret=local-gateway-secret-change-me

spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=http://localhost:8081
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/auth/**
spring.cloud.gateway.server.webflux.routes[0].filters[0]=RewritePath=/api/auth/(?<segment>.*), /auth/${segment}

spring.cloud.gateway.server.webflux.routes[1].id=user-service
spring.cloud.gateway.server.webflux.routes[1].uri=http://localhost:8082
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/users/**
spring.cloud.gateway.server.webflux.routes[1].filters[0]=RewritePath=/api/users/(?<segment>.*), /users/${segment}

spring.cloud.gateway.server.webflux.routes[2].id=wallet-service
spring.cloud.gateway.server.webflux.routes[2].uri=http://localhost:8083
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/wallet/**
spring.cloud.gateway.server.webflux.routes[2].filters[0]=RewritePath=/api/wallet/(?<segment>.*), /wallet/${segment}

spring.cloud.gateway.server.webflux.routes[3].id=payment-service
spring.cloud.gateway.server.webflux.routes[3].uri=http://localhost:8085
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/payments/**
spring.cloud.gateway.server.webflux.routes[3].filters[0]=RewritePath=/api/payments/(?<segment>.*), /payments/${segment}

spring.cloud.gateway.server.webflux.routes[4].id=game-service
spring.cloud.gateway.server.webflux.routes[4].uri=http://localhost:8087
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/games/**
spring.cloud.gateway.server.webflux.routes[4].filters[0]=RewritePath=/api/games(?<segment>/?.*), /games${segment}

spring.cloud.gateway.server.webflux.routes[5].id=game-provider-wallet-authenticate
spring.cloud.gateway.server.webflux.routes[5].uri=http://localhost:8087
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/api/provider-wallet/authenticate
spring.cloud.gateway.server.webflux.routes[5].predicates[1]=Method=POST

spring.cloud.gateway.server.webflux.routes[6].id=game-provider-wallet-bet
spring.cloud.gateway.server.webflux.routes[6].uri=http://localhost:8087
spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/api/provider-wallet/bet
spring.cloud.gateway.server.webflux.routes[6].predicates[1]=Method=POST

spring.cloud.gateway.server.webflux.routes[7].id=game-provider-wallet-result
spring.cloud.gateway.server.webflux.routes[7].uri=http://localhost:8087
spring.cloud.gateway.server.webflux.routes[7].predicates[0]=Path=/api/provider-wallet/result
spring.cloud.gateway.server.webflux.routes[7].predicates[1]=Method=POST
